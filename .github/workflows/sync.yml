# Copy this site's files from the shared catalog repository (ChiaraMingarelli/funding-finders,
# folder sites/<this repo>/) and publish them. Runs every hour; publishes when something changed
# or when the live site does not match this repository.
name: Sync from the shared catalog

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-pages
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.fetch.outputs.changed }}
      stale: ${{ steps.fetch.outputs.stale }}
    steps:
      - name: Keep the hourly schedule enabled
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/sync.yml/enable"
      - uses: actions/checkout@v4
      - name: Fetch this site's files
        id: fetch
        env:
          REPO: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --filter=blob:none --sparse https://github.com/ChiaraMingarelli/funding-finders.git "$RUNNER_TEMP/hub"
          git -C "$RUNNER_TEMP/hub" sparse-checkout set "sites/$REPO"
          SRC="$RUNNER_TEMP/hub/sites/$REPO"
          test -s "$SRC/MANIFEST"
          if [ -f .sync-manifest ]; then
            comm -23 <(sort .sync-manifest) <(sort "$SRC/MANIFEST") | while read -r f; do
              [ -n "$f" ] && git rm -q --ignore-unmatch -- "$f"
            done
          fi
          while read -r f; do
            [ -z "$f" ] && continue
            case "$f" in *..*|/*) echo "::error::bad path in MANIFEST: $f"; exit 1;; esac
            mkdir -p "$(dirname "$f")"
            cp "$SRC/$f" "$f"
          done < "$SRC/MANIFEST"
          cp "$SRC/MANIFEST" .sync-manifest
          python3 - <<'PY'
          import json, re
          html = open("index.html", encoding="utf-8").read()
          assert "SNAPSHOT:START" in html, "index.html has no data block"
          n = len(json.load(open("data/programs.json", encoding="utf-8")))
          assert n > 0, "no programs"
          p = "README.md"
          s = open(p, encoding="utf-8").read()
          open(p, "w", encoding="utf-8").write(re.sub(r"(`data/programs\.json` has )\d+( programs)", rf"\g<1>{n}\g<2>", s))
          print(n, "programs")
          PY
          live=$(curl -fsSL "https://chiaramingarelli.github.io/$REPO/index.html" | sha256sum | cut -d' ' -f1 || true)
          if [ "$live" = "$(sha256sum index.html | cut -d' ' -f1)" ]; then echo "stale=false" >> "$GITHUB_OUTPUT"; else echo "stale=true" >> "$GITHUB_OUTPUT"; fi
          git add -A
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - name: Commit
        if: steps.fetch.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync with the shared catalog"
          git push origin HEAD:main

  deploy:
    needs: sync
    if: needs.sync.outputs.changed == 'true' || needs.sync.outputs.stale == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
